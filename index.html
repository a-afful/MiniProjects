<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 300px;
        }

        h1 {
            color: #333;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            font-weight: 300;
        }

        .counter-display {
            font-size: 4rem;
            font-weight: bold;
            color: #667eea;
            margin: 2rem 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .button-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
            min-width: 80px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .decrease {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }

        .decrease:hover {
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.4);
        }

        .increase {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
            box-shadow: 0 4px 15px rgba(81, 207, 102, 0.3);
        }

        .increase:hover {
            box-shadow: 0 6px 20px rgba(81, 207, 102, 0.4);
        }

        .reset-btn {
            margin-top: 1rem;
            background: linear-gradient(135deg, #868e96 0%, #495057 100%);
            box-shadow: 0 4px 15px rgba(134, 142, 150, 0.3);
            font-size: 1rem;
            padding: 0.8rem 1.5rem;
        }

        .reset-btn:hover {
            box-shadow: 0 6px 20px rgba(134, 142, 150, 0.4);
        }

        @media (max-width: 480px) {
            .container {
                margin: 1rem;
                padding: 2rem;
            }
            
            .counter-display {
                font-size: 3rem;
            }
            
            .button-container {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Counter App</h1>
        <div class="counter-display" id="counter">0</div>
        <div class="button-container">
            <button class="decrease" onclick="decreaseCounter()">-</button>
            <button class="increase" onclick="increaseCounter()">+</button>
        </div>
        <button class="reset-btn" onclick="resetCounter()">Reset</button>
    </div>

    <script>
        let counter = 0;

        function updateDisplay() {
            document.getElementById('counter').textContent = counter;
        }

        function increaseCounter() {
            counter++;
            updateDisplay();
        }

        function decreaseCounter() {
            counter--;
            updateDisplay();
        }

        function resetCounter() {
            counter = 0;
            updateDisplay();
        }

        // Keyboard support
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowUp' || event.key === '+') {
                increaseCounter();
            } else if (event.key === 'ArrowDown' || event.key === '-') {
                decreaseCounter();
            } else if (event.key === 'r' || event.key === 'R') {
                resetCounter();
            }
        });
    </script>
</body>
</html>
